# Despliegue de LGC 1989 en Fly.io. El nombre de la app debe ser unico en Fly:
# si "lgc1989" esta tomado, cambialo aca y en `fly apps create`.
app = "lgc1989"
primary_region = "mad"          # Madrid

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale-to-zero: la maquina se apaga tras unos minutos sin visitas y se
  # enciende sola con la siguiente consulta (la primera tarda unos segundos).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# 1 GB: el peor caso (busqueda desbocada hasta el corte de 20 s) usa ~430 MB
# de heap de SBCL.
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
